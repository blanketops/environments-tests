version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
  - copyloopvar
  - dupl
  - errcheck
  - ginkgolinter
  - goconst
  - gocyclo
  - govet
  - ineffassign
  - lll
  - modernize
  - misspell
  - nakedret
  - prealloc
  - revive
  - staticcheck
  - unconvert
  - unparam
  - unused
  settings:
    gocyclo:
      min-complexity: 40
    revive:
      rules:
      - name: comment-spacings
      - name: import-shadowing
    modernize:
      disable:
      - omitzero
      # Go 1.27 lets a struct literal set an embedded struct's fields
      # directly; kept in the explicit form, as in environments-controller.
      - embedlit
  exclusions:
    generated: lax
    rules:
    - linters:
      - dupl
      - lll
      path: tests/data/*
    - linters:
      - dupl
      path: tests/(fake|grpc)/*
    - linters:
      - staticcheck
      text: "ST1001:"
      path: tests/fake/*
    - linters:
      - dupl
      path: tests/profile/*
    - linters:
      - dupl
      path: tests/benchmark/*
    paths:
    - third_party$
    - builtin$
    - examples$
formatters:
  enable:
  - gofmt
  - goimports
  exclusions:
    generated: lax
    paths:
    - third_party$
    - builtin$
    - examples$
