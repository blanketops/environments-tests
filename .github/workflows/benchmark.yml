name: Benchmark Tests

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM
  workflow_dispatch:
    inputs:
      test_path:
        description: "Path to benchmark (e.g. ./tests/benchmark/...)"
        required: false
        default: "./tests/benchmark/..."
      bench_filter:
        description: "Benchmark filter (e.g. BenchmarkEnvironment)"
        required: false
        default: "."

env:
  ENVIRONMENTS_INSTALL_REF: v0.2.6
  TEST_HELPER_REF: e5ebf4cdf4a8ece7821f6142813f40ecbe11715d

jobs:
  benchmark:
    name: Benchmark suites
    runs-on: self-hosted
    permissions:
      contents: read
      checks: write
      issues: write

    steps:
    - name: Clone the code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        cache: false
        go-version-file: go.mod

    - name: Download modules
      run: go mod download

    - name: Install test-helper
      id: test-helper
      continue-on-error: true
      run: |
        GOBIN="${RUNNER_TEMP}/bin" go install "github.com/blanketops/environments-bots/cmd/test-helper@${TEST_HELPER_REF}"
        echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

    - name: Mint the test bot's token
      id: bot-token
      if: steps.test-helper.outcome == 'success'
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.TESTS_APP_ID }}
        private-key: ${{ secrets.TESTS_APP_PRIVATE_KEY }}
        owner: blanketops
        repositories: environments-tests

    - name: Open issues for new test files
      if: steps.test-helper.outcome == 'success'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
        PROJECT: ${{ steps.bot-token.outputs.token && 'blanketops/1' || '' }}
        SOURCE: ${{ github.event.workflow_dispatch.html_url || format('{0}/actions/runs/{1}', github.repository_url, github.run_id) }}
      run: test-helper sync -source "$SOURCE" ${PROJECT:+-project "$PROJECT"}

    - name: Start the Kubernetes API (envtest)
      run: |
        envtest-up
        kubectl version

    - name: Checkout environments-install
      uses: actions/checkout@v4
      with:
        repository: blanketops/environments-install
        ref: ${{ env.ENVIRONMENTS_INSTALL_REF }}
        path: environments-install

    - name: Install CRDs
      run: |
        cd environments-install
        mkdir -p bin
        cp "$(command -v kustomize)" bin/kustomize
        touch bin/kustomize
        make install

    - name: Install observer-layer CRDs
      run: |
        go mod download github.com/shipwright-io/build github.com/argoproj/argo-events
        BUILDRUN_CRD="$(go list -m -f '{{.Dir}}' github.com/shipwright-io/build)/deploy/crds/shipwright.io_buildruns.yaml"
        SENSOR_CRD="$(go list -m -f '{{.Dir}}' github.com/argoproj/argo-events)/manifests/base/crds/argoproj.io_sensors.yaml"
        kubectl apply --server-side -f "$BUILDRUN_CRD"
        kubectl apply -f "$SENSOR_CRD"
        kubectl patch crd buildruns.shipwright.io --type merge -p '{"spec":{"conversion":{"strategy":"None","webhook":null}}}'

    - name: Resolve test path
      id: resolve
      run: |
        TEST_PATH="${{ github.event.inputs.test_path }}"
        BENCH_FILTER="${{ github.event.inputs.bench_filter }}"

        if [ -z "$TEST_PATH" ]; then
          TEST_PATH="./tests/benchmark/..."
        fi

        echo "test_path=$TEST_PATH" >> "$GITHUB_OUTPUT"
        echo "bench_filter=$BENCH_FILTER" >> "$GITHUB_OUTPUT"
        echo "Running benchmarks: $TEST_PATH -bench $BENCH_FILTER"

    - name: Run benchmarks
      run: |
        TEST_PATH="${{ steps.resolve.outputs.test_path }}"
        BENCH_FILTER="${{ steps.resolve.outputs.bench_filter }}"

        mkdir -p reports
        : > reports/benchmark-output.json

        # Find packages with benchmarks
        BENCH_PKGS=$(go list $TEST_PATH | grep -v "tests/profile" || true)

        if [ -z "$BENCH_PKGS" ]; then
          echo "No benchmark packages found"
          exit 0
        fi

        echo "Running benchmarks in: $BENCH_PKGS"

        for pkg in $BENCH_PKGS; do
          echo "Benchmarking $pkg"
          go test "$pkg" -bench="$BENCH_FILTER" -benchmem -benchtime=3s -count=3 -timeout 10m -json 2>&1 \
            | tee -a reports/benchmark-output.json
        done

    - name: Post results to the test issues
      if: always() && steps.test-helper.outcome == 'success'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ steps.bot-token.outputs.token || secrets.GITHUB_TOKEN }}
        REF: "Benchmark run #${{ github.run_number }}"
      run: |
        test-helper report -go-json reports/benchmark-output.json -ref "$REF"

    - name: Convert to JUnit XML
      if: always()
      run: |
        go install github.com/jstemmer/go-junit-report/v2@latest
        cat reports/benchmark-output.json \
          | go-junit-report -parser gojson \
          > reports/benchmark-junit.xml
        echo "JUnit report written to reports/benchmark-junit.xml"

    - name: Upload benchmark report
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: benchmark-report-${{ github.run_number }}
        path: reports/
        retention-days: 30

    - name: Summary
      if: always()
      run: |
        BENCH_COUNT=$(jq -r 'select(.Action=="bench" and .Test!=null) | .Test' reports/benchmark-output.json 2>/dev/null | sort -u | wc -l)
        {
          echo "### Benchmark results"
          echo ""
          echo "| Status | Count |"
          echo "|--------|-------|"
          echo "| 📊 Benchmarks | $BENCH_COUNT |"
        } >> "$GITHUB_STEP_SUMMARY"