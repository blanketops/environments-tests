name: Create Test Issues

on:
  pull_request:
    types: [closed]
    branches:
    - main
  workflow_dispatch:
    inputs:
      full_scan:
        description: "Scan every test file in the tree instead of a single PR's diff"
        type: boolean
        required: false
        default: true

jobs:
  create-issues:
    name: Create issues from merged test files
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read

    steps:
    - name: Clone the code
      uses: actions/checkout@v4
      with:
        ref: master

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Resolve changed test files
      id: files
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # workflow_dispatch (full_scan) or no PR context — fall back to a full tree scan.
        # A merged PR — only the test files that PR actually touched, so a
        # merge to main creates issues for what changed, not the whole tree.
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.full_scan }}" != "false" ]; then
          find tests/ -name "*.go" | sort > files.txt
        else
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' \
            | grep -E '^tests/.*\.go$' | sort -u > files.txt || true
        fi
        echo "Resolved $(wc -l < files.txt) test file(s):"
        cat files.txt

    - name: Create test tracking issues
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        # For each test file touched by the merge — create a tracking issue
        # if one does not exist yet.
        # Issue title format: [test] <package>/<filename>
        # Label: test-tracking
        # Only creates — never duplicates.

        # Ensure label exists
        gh label create "test-tracking" \
          --color "0075ca" \
          --description "Tracks test file coverage and wiring status" \
          --repo "$REPO" 2>/dev/null || true

        gh label create "grpc" \
          --color "e4e669" \
          --description "gRPC test" \
          --repo "$REPO" 2>/dev/null || true

        gh label create "fake" \
          --color "d93f0b" \
          --description "Fake domain controller test" \
          --repo "$REPO" 2>/dev/null || true

        created=0
        skipped=0
        failed=0

        while read -r file; do
          [ -z "$file" ] && continue
          pkg=$(dirname "$file" | sed 's|tests/||')
          filename=$(basename "$file" .go)
          title="[test] ${pkg}/${filename}"

          # Check if issue already exists
          existing=$(gh issue list \
            --repo "$REPO" \
            --label "test-tracking" \
            --search "\"$title\" in:title" \
            --json number \
            --jq '.[0].number' 2>/dev/null)

          if [ -n "$existing" ]; then
            echo "Issue already exists for $title (#$existing) — skipping"
            skipped=$((skipped + 1))
            continue
          fi

          # Determine labels based on path
          labels="test-tracking"
          echo "$file" | grep -q "grpc"  && labels="$labels,grpc"
          echo "$file" | grep -q "fake"  && labels="$labels,fake"
          echo "$file" | grep -q "data"  && labels="$labels,data"

          # Build issue body
          body="## Test File: \`${file}\`
            **Package:** \`${pkg}\`
            **File:** \`${filename}\`
            **Commit:** ${{ github.sha }}
            **Merged via:** ${PR_URL:-manual workflow_dispatch}

            ### Status
            - [ ] Compiles
            - [ ] t.Skip removed / test wired
            - [ ] Passes on ubuntu-latest runner
            - [ ] Passes in CI
            ### Notes
            _Add wiring notes, blockers, or context here._"

          if gh issue create \
            --repo "$REPO" \
            --title "$title" \
            --body "$body" \
            --label "$labels"; then
            echo "Created issue: $title"
            created=$((created + 1))
          else
            echo "Failed to create issue: $title"
            failed=$((failed + 1))
          fi
        done < files.txt

        {
          echo "### Test tracking issues — $(wc -l < files.txt) file(s) processed"
          echo ""
          echo "| Result | Count |"
          echo "|--------|-------|"
          echo "| 🆕 Created | $created |"
          echo "| ⏭️ Already existed | $skipped |"
          echo "| ❌ Failed | $failed |"
        } >> "$GITHUB_STEP_SUMMARY"
