name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure Git for private modules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          go env -w GOPRIVATE=github.com/ntlaletsi70/*
          go env -w GONOSUMDB=github.com/ntlaletsi70/*
          go env -w GOPROXY=direct

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ \`make test\` passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ \`make test\` failed — see \`Running Tests\` step above" >> "$GITHUB_STEP_SUMMARY"
          fi
