# tests/data only: fixture builders and engine conformance tests, which need
# no cluster. The suites under tests/fake and tests/grpc run in run-tests.yml.
name: Data Tests

# Pushes run only on the long-lived branches; work branches run through their
# pull request. With both triggers on every branch, each check ran twice on a
# pull request and queued twice on the repository's single runner.
on:
  push:
    branches: [test, master]
  pull_request:

jobs:
  test:
    name: Fixtures and conformance (tests/data)
    runs-on: self-hosted
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # The self-hosted runners keep Go's module and build caches on a
          # persistent volume. setup-go's own cache would upload them again
          # after every job, which on these runners hangs "Post Setup Go" for
          # up to an hour and holds the runner.
          cache: false
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ \`make test\` passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ \`make test\` failed — see \`Running Tests\` step above" >> "$GITHUB_STEP_SUMMARY"
          fi
