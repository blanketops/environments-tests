name: Suite Tests

# Pushes run only on the long-lived branches; work branches run through their
# pull request (see lint.yml).
on:
  push:
    branches: [test, master]
  pull_request:
  workflow_dispatch:
    inputs:
      test_path:
        description: "Path to test (e.g. ./tests/fake/environments/... or ./tests/grpc/...)"
        required: false
        default: "./tests/..."
      test_run:
        description: "Filter by test name (e.g. TestBuildService or Build)"
        required: false
        default: ""

# The environments-install release whose CRDs the tests run against.
env:
  ENVIRONMENTS_INSTALL_REF: v0.2.6

jobs:
  test:
    name: fake and gRPC suites (envtest)
    runs-on: self-hosted
    permissions:
      contents: read
      checks: write

    steps:
    - name: Clone the code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        # The self-hosted runners keep Go's module and build caches on a
        # persistent volume. setup-go's own cache would upload them again
        # after every job, which on these runners hangs "Post Setup Go" for
        # up to an hour and holds the runner.
        cache: false
        go-version-file: go.mod

    # The committed go.mod/go.sum are authoritative; `go mod tidy` in CI
    # re-resolves the module graph and can pull in untested versions.
    - name: Download modules
      run: go mod download

    # The runner pods have no Docker daemon, so kind cannot run here, and a
    # privileged Docker sidecar would give PR code root on the node. The
    # tests only need CRDs and the API (no controller, no pods), so etcd and
    # kube-apiserver from envtest (baked into the runner image) run as the
    # runner user. envtest-up exports KUBECONFIG for the steps below.
    - name: Start the Kubernetes API (envtest)
      run: |
        envtest-up
        kubectl version

    - name: Checkout environments-install
      uses: actions/checkout@v4
      with:
        repository: blanketops/environments-install
        ref: ${{ env.ENVIRONMENTS_INSTALL_REF }}
        path: environments-install

    - name: Install CRDs
      run: |
        cd environments-install
        # The Makefile downloads kustomize into bin/ unless it is there;
        # use the runner image's copy (same version, KUSTOMIZE_VERSION).
        mkdir -p bin
        cp "$(command -v kustomize)" bin/kustomize
        touch bin/kustomize
        make install

    - name: Install observer-layer CRDs
      run: |
        # tests/fake/observers drives Shipwright BuildRun and Argo Events
        # Sensor objects directly (same "no controller, just the CRD"
        # pattern as the BlanketOps CRDs above) — pull them straight from
        # the already-downloaded Go module cache rather than fetching
        # upstream release manifests separately.
        go mod download github.com/shipwright-io/build github.com/argoproj/argo-events
        BUILDRUN_CRD="$(go list -m -f '{{.Dir}}' github.com/shipwright-io/build)/deploy/crds/shipwright.io_buildruns.yaml"
        SENSOR_CRD="$(go list -m -f '{{.Dir}}' github.com/argoproj/argo-events)/manifests/base/crds/argoproj.io_sensors.yaml"

        # buildruns.shipwright.io exceeds kubectl apply's
        # last-applied-configuration annotation size limit.
        kubectl apply --server-side -f "$BUILDRUN_CRD"
        kubectl apply -f "$SENSOR_CRD"

        # BuildRun is multi-version (v1alpha1/v1beta1) with a conversion
        # webhook pointing at Shipwright's own controller, which isn't
        # installed here — these tests only ever touch it through the
        # v1alpha1 client type, so disable conversion rather than standing
        # up the full Shipwright operator just for CRD registration.
        kubectl patch crd buildruns.shipwright.io --type merge -p '{"spec":{"conversion":{"strategy":"None","webhook":null}}}'

    - name: Resolve test path
      id: resolve
      run: |
        # Use workflow_dispatch input if provided, else run all tests
        TEST_PATH="${{ github.event.inputs.test_path }}"
        TEST_RUN="${{ github.event.inputs.test_run }}"

        if [ -z "$TEST_PATH" ]; then
          TEST_PATH="./tests/..."
        fi

        echo "test_path=$TEST_PATH" >> "$GITHUB_OUTPUT"
        echo "test_run=$TEST_RUN"   >> "$GITHUB_OUTPUT"
        echo "Running: $TEST_PATH ${TEST_RUN:+-run $TEST_RUN}"

    - name: Run tests
      run: |
        TEST_PATH="${{ steps.resolve.outputs.test_path }}"
        TEST_RUN="${{ steps.resolve.outputs.test_run }}"

        mkdir -p reports

        RUN_FLAG=""
        if [ -n "$TEST_RUN" ]; then
          RUN_FLAG="-run $TEST_RUN"
        fi

        go test \
          $TEST_PATH \
          $RUN_FLAG \
          -v \
          -count=1 \
          -timeout 10m \
          -json \
          2>&1 | tee reports/test-output.json

        # Exit code from go test — not tee
        exit "${PIPESTATUS[0]}"

    - name: Convert to JUnit XML
      if: always()
      run: |
        # go-junit-report converts go test -json to JUnit XML for artifact upload
        go install github.com/jstemmer/go-junit-report/v2@latest
        cat reports/test-output.json \
          | go-junit-report -parser gojson \
          > reports/junit.xml
        echo "JUnit report written to reports/junit.xml"

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: test-report-${{ github.run_number }}
        path: reports/
        retention-days: 15

    # The Allure steps only build a report. allure-commandline needs Java,
    # which the runner image does not have yet, so they do not fail the job;
    # the test result above is what passes or fails it. The runner user
    # cannot write to npm's global prefix, so Allure goes under RUNNER_TEMP.
    - name: Install Allure CLI
      if: always()
      continue-on-error: true
      run: |
        npm install --prefix "${RUNNER_TEMP}/allure" allure-commandline
        echo "${RUNNER_TEMP}/allure/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Restore Allure history
      if: always()
      uses: actions/cache@v4
      with:
        path: allure-history
        key: allure-history-${{ github.run_id }}
        restore-keys: |
          allure-history-

    - name: Seed Allure history
      if: always()
      run: |
        mkdir -p reports/history
        if [ -d allure-history/history ]; then
          cp -r allure-history/history/. reports/history/
        fi

    - name: Generate Allure report
      if: always()
      continue-on-error: true
      run: |
        # Allure2 auto-detects JUnit XML in the input directory — no native
        # allure-results needed for a go test / go-junit-report pipeline.
        # reports/history (seeded above) is what makes the trend widgets
        # (duration/history/retry/categories-trend) build up over runs
        # instead of resetting every time.
        allure generate reports/ -o allure-report --clean

    - name: Persist Allure history
      if: always()
      continue-on-error: true
      run: |
        mkdir -p allure-history
        rm -rf allure-history/history
        cp -r allure-report/history allure-history/history

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: allure-report-${{ github.run_number }}
        path: allure-report/
        retention-days: 15

    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: "Test Results"
        path: reports/junit.xml
        reporter: java-junit
        fail-on-error: false

    - name: Summary
      if: always()
      run: |
        PASS=$(jq -r 'select(.Action=="pass" and .Test!=null) | .Test' reports/test-output.json 2>/dev/null | sort -u | wc -l)
        FAIL=$(jq -r 'select(.Action=="fail" and .Test!=null) | .Test' reports/test-output.json 2>/dev/null | sort -u | wc -l)
        SKIP=$(jq -r 'select(.Action=="skip" and .Test!=null) | .Test' reports/test-output.json 2>/dev/null | sort -u | wc -l)

        {
          echo "### Test results — \`${{ steps.resolve.outputs.test_path }}\`"
          echo ""
          echo "| Status | Count |"
          echo "|--------|-------|"
          echo "| ✅ Passed | $PASS |"
          echo "| ❌ Failed | $FAIL |"
          echo "| ⏭️ Skipped | $SKIP |"
        } >> "$GITHUB_STEP_SUMMARY"
