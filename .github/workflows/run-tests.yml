name: Run Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_path:
        description: "Path to test (e.g. ./tests/fake/environments/... or ./tests/grpc/...)"
        required: false
        default: "./tests/..."
      test_run:
        description: "Filter by test name (e.g. TestBuildService or Build)"
        required: false
        default: ""

jobs:
  test:
    name: Run on ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
    - name: Clone the code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Tidy dependencies
      run: go mod tidy

    - name: Install kind
      run: |
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind

    - name: Create kind cluster
      run: kind create cluster --wait 120s

    - name: Checkout environments-install
      uses: actions/checkout@v4
      with:
        repository: blanketops/environments-install
        path: environments-install

    - name: Install CRDs
      run: |
        cd environments-install
        make install

    - name: Resolve test path
      id: resolve
      run: |
        # Use workflow_dispatch input if provided, else run all tests
        TEST_PATH="${{ github.event.inputs.test_path }}"
        TEST_RUN="${{ github.event.inputs.test_run }}"

        if [ -z "$TEST_PATH" ]; then
          TEST_PATH="./tests/..."
        fi

        echo "test_path=$TEST_PATH" >> "$GITHUB_OUTPUT"
        echo "test_run=$TEST_RUN"   >> "$GITHUB_OUTPUT"
        echo "Running: $TEST_PATH ${TEST_RUN:+-run $TEST_RUN}"

    - name: Run tests
      run: |
        TEST_PATH="${{ steps.resolve.outputs.test_path }}"
        TEST_RUN="${{ steps.resolve.outputs.test_run }}"

        mkdir -p reports

        RUN_FLAG=""
        if [ -n "$TEST_RUN" ]; then
          RUN_FLAG="-run $TEST_RUN"
        fi

        go test \
          $TEST_PATH \
          $RUN_FLAG \
          -v \
          -count=1 \
          -timeout 10m \
          -json \
          2>&1 | tee reports/test-output.json

        # Exit code from go test — not tee
        exit "${PIPESTATUS[0]}"

    - name: Convert to JUnit XML
      if: always()
      run: |
        # go-junit-report converts go test -json to JUnit XML for artifact upload
        go install github.com/jstemmer/go-junit-report/v2@latest
        cat reports/test-output.json \
          | go-junit-report -parser gojson \
          > reports/junit.xml
        echo "JUnit report written to reports/junit.xml"

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report-${{ github.run_number }}
        path: reports/
        retention-days: 15

    - name: Install Allure CLI
      if: always()
      run: npm install -g allure-commandline

    - name: Restore Allure history
      if: always()
      uses: actions/cache@v4
      with:
        path: allure-history
        key: allure-history-${{ github.run_id }}
        restore-keys: |
          allure-history-

    - name: Seed Allure history
      if: always()
      run: |
        mkdir -p reports/history
        if [ -d allure-history/history ]; then
          cp -r allure-history/history/. reports/history/
        fi

    - name: Generate Allure report
      if: always()
      run: |
        # Allure2 auto-detects JUnit XML in the input directory — no native
        # allure-results needed for a go test / go-junit-report pipeline.
        # reports/history (seeded above) is what makes the trend widgets
        # (duration/history/retry/categories-trend) build up over runs
        # instead of resetting every time.
        allure generate reports/ -o allure-report --clean

    - name: Persist Allure history
      if: always()
      run: |
        mkdir -p allure-history
        rm -rf allure-history/history
        cp -r allure-report/history allure-history/history

    - name: Upload Allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report-${{ github.run_number }}
        path: allure-report/
        retention-days: 15

    - name: Publish test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: "Test Results"
        path: reports/junit.xml
        reporter: java-junit
        fail-on-error: false

    - name: Summary
      if: always()
      run: |
        PASS=$(jq -r 'select(.Action=="pass" and .Test!=null) | .Test' reports/test-output.json 2>/dev/null | sort -u | wc -l)
        FAIL=$(jq -r 'select(.Action=="fail" and .Test!=null) | .Test' reports/test-output.json 2>/dev/null | sort -u | wc -l)
        SKIP=$(jq -r 'select(.Action=="skip" and .Test!=null) | .Test' reports/test-output.json 2>/dev/null | sort -u | wc -l)

        {
          echo "### Test results — \`${{ steps.resolve.outputs.test_path }}\`"
          echo ""
          echo "| Status | Count |"
          echo "|--------|-------|"
          echo "| ✅ Passed | $PASS |"
          echo "| ❌ Failed | $FAIL |"
          echo "| ⏭️ Skipped | $SKIP |"
        } >> "$GITHUB_STEP_SUMMARY"
