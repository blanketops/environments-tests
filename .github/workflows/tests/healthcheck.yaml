name: Health Check

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  health:
    name: Health Check
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      issues: write

    steps:
    - name: Clone the code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        cache: false
        go-version-file: go.mod

    - name: Download modules
      run: go mod download

    - name: Start Kubernetes API (envtest)
      run: |
        envtest-up
        kubectl version

    - name: Checkout environments-install
      uses: actions/checkout@v4
      with:
        repository: blanketops/environments-install
        ref: ${{ env.ENVIRONMENTS_INSTALL_REF }}
        path: environments-install

    - name: Install CRDs
      run: |
        cd environments-install
        mkdir -p bin
        cp "$(command -v kustomize)" bin/kustomize
        touch bin/kustomize
        make install

    - name: Install observer-layer CRDs
      run: |
        go mod download github.com/shipwright-io/build github.com/argoproj/argo-events
        BUILDRUN_CRD="$(go list -m -f '{{.Dir}}' github.com/shipwright-io/build)/deploy/crds/shipwright.io_buildruns.yaml"
        SENSOR_CRD="$(go list -m -f '{{.Dir}}' github.com/argoproj/argo-events)/manifests/base/crds/argoproj.io_sensors.yaml"
        kubectl apply --server-side -f "$BUILDRUN_CRD"
        kubectl apply -f "$SENSOR_CRD"
        kubectl patch crd buildruns.shipwright.io --type merge -p '{"spec":{"conversion":{"strategy":"None","webhook":null}}}'

    - name: Quick health check tests
      run: |
        # Run a subset of critical tests to verify system health
        go test ./tests/fake/environments/... -run "TestHealth" -v -count=1 -timeout 5m 2>&1 | tee health-output.txt || true
        
        # Check if any tests ran
        if grep -q "PASS\|FAIL" health-output.txt; then
          echo "Health check tests executed"
        else
          echo "No health tests found, running smoke test"
          go test ./tests/fake/environments/... -v -count=1 -timeout 5m 2>&1 | head -50
        fi

    - name: Verify CRDs are ready
      run: |
        # Quick check that all CRDs are installed
        kubectl get crd | grep -E "(zenithrunner|zenithrunnerapp|environment|build|deployment)" | wc -l

    - name: Summary
      if: always()
      run: |
        echo "### Health Check Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Run at: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

env:
  ENVIRONMENTS_INSTALL_REF: v0.2.6