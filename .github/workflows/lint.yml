name: Lint

# Pushes run only on the long-lived branches; work branches run through their
# pull request. With both triggers on every branch, each check ran twice on a
# pull request and queued twice on the repository's single runner.
on:
  push:
    branches: [test, master]
  pull_request:

jobs:
  lint:
    name: golangci-lint
    runs-on: self-hosted
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # The self-hosted runners keep Go's module and build caches on a
          # persistent volume. setup-go's own cache would upload them again
          # after every job, which on these runners hangs "Post Setup Go" for
          # up to an hour and holds the runner.
          cache: false
          go-version-file: go.mod

      # golangci-lint is baked into the runner image (2.14.0, built with Go
      # 1.27). `make lint` installs the Makefile's pinned copy, which an older
      # Go would build into a binary that cannot load Go 1.27 packages.
      - name: Check linter configuration
        run: |
          golangci-lint version
          golangci-lint config verify
      - name: Run linter
        run: golangci-lint run

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ Lint passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Lint failed — see \`Run linter\` step above" >> "$GITHUB_STEP_SUMMARY"
          fi
